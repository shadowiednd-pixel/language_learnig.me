<!DOCTYPE html>
<html lang="pt-BR" data-tema="chines">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Hub Poliglota — 12 Idiomas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="login-wrapper">
    <div class="card login-card">
      <h1>Hub Poliglota</h1>
      <p class="texto-sec">Entre com sua senha individual</p>
      <form id="formLogin">
        <label for="inputSenha">Senha de Acesso</label>
        <input type="password" id="inputSenha" required placeholder="Sua senha">
        <button type="submit" id="btnLogin" class="btn-tema full">Entrar</button>
      </form>
      <div id="erroLogin" class="alerta erro"></div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div id="appEstudos" class="app-wrapper oculto">

    <!-- TOPO COM BARRA DE IDIOMAS -->
    <header class="topo">
      <div class="barra-idiomas-wrap">
        <div id="seletorIdioma" class="seletor-idioma" role="group" aria-label="Alternar idioma"></div>
        <button type="button" id="btnGerenciarIdiomas" class="btn-ghost" title="Ativar/Desativar idiomas">⚙️ Idiomas</button>
      </div>

      <div class="topo-direita">
        <span id="badgeUsuario" class="tag-tema">Perfil</span>
        <span id="statusHoje" class="badge-hoje">Hoje: 0 cards</span>
        <button type="button" id="btnBloquear" class="btn-ghost" title="Sair">🔒</button>
      </div>
    </header>

    <!-- PAINEL DE SELEÇÃO DOS 12 IDIOMAS -->
    <section id="painelConfigIdiomas" class="card config-idiomas oculto">
      <div class="config-topo">
        <h3>Quais línguas você quer ativas na barra agora?</h3>
        <button type="button" id="btnFecharConfig" class="btn-ghost">Concluir</button>
      </div>
      <div id="gridCheckIdiomas" class="grid-checks"></div>
    </section>

    <!-- TIMER POMODORO DE ROTAÇÃO -->
    <section class="barra-rotacao">
      <div class="rotacao-info">
        <span class="tag-tema" id="labelRotacao">Rotação: Mandarim</span>
        <strong id="displayTimer" class="timer-num">25:00</strong>
      </div>
      <div class="rotacao-controles">
        <button type="button" id="btnIniciarTimer" class="btn-tema">▶ Iniciar</button>
        <button type="button" id="btnResetTimer" class="btn-ghost">↺ 25m</button>
        <button type="button" id="btnTrocarRotacao" class="btn-ghost">⇄ Próximo Idioma</button>
      </div>
    </section>

    <main class="conteudo">

      <!-- ABA 1: REVISÃO DE FLASHCARDS (COM SUPORTE A [LACUNAS]) -->
      <section id="abaRevisar" class="painel ativo">
        <div class="cabecalho-painel">
          <h2>Revisão (<span id="qtdPendentes">0</span>)</h2>
          <div class="filtros-mini">
            <select id="filtroCatCard">
              <option value="TODAS">Todas as categorias</option>
            </select>
            <label class="toggle-pinyin" id="boxToggleExtra">
              <input type="checkbox" id="checkOcultarExtra" checked>
              <span id="labelToggleExtra">Mostrar leitura</span>
            </label>
          </div>
        </div>

        <div id="areaFlashcard" class="card-estudo">
          <div class="card-topo">
            <span id="cardCategoria" class="tag-tema">Categoria</span>
            <span id="cardNivel" class="nivel-pill">Nível 1</span>
          </div>

          <div class="card-centro">
            <div id="cardFrente
